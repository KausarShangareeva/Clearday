${JSON.stringify(this.context())}

${history ? 'Conversation so far:\n' + history + '\n' : ''}
User: ${q}

Respond with JSON only, no markdown fences:
{"answer": string, "refs": [ids of emails you relied on], "draftFor": email id or null, "draft": reply text signed "${firstName()}" or null (only when the user asks for a reply or draft)}`;
        const r = await SAMPLE.json(prompt, {modelTier:'quick', cache:false});

async function ask(q){
  q = q.trim(); if(!q || S.chatBusy) return;
  if(S.page === 'board') S.askOpen = true;
  else if(S.page !== 'assistant'){ S.page = 'assistant'; }
  S.chat.push({role:'user', text:q}); S.chatBusy = true;
  const ci = document.getElementById('chatInput'); if(ci) ci.value = '';
  render({noFocus:true});
  const r = await InboxAssistant.ask(q);
  S.chatBusy = false;
  S.chat.push({role:'ai', text:r.text, refs:r.refs || [], draft:r.draft || null, draftFor:r.draftFor || null, live:!!r.live});
  if(r.draft && r.draftFor) S.drafts[r.draftFor] = {text:r.draft, tone:'Professional'};
  render({noFocus:true});
  if(S.voiceMode) speak(r.text + (r.draft ? ' The draft is on screen for you to review.' : ''));
}

let recog = null;
function toggleMic(){
  if(liveVoiceOn()){
    if(S.page === 'board') S.askOpen = true;
    if(window.LiveVoice.state === 'idle'){ S.voiceMode = false; window.LiveVoice.start(); } else window.LiveVoice.stop();
    render({noFocus:true});
    return;
  }
  if(S.page === 'board' && !S.askOpen){ S.askOpen = true; render({noFocus:true}); }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  S.voiceMode = true;
  if(!SR){ render(); toast('Speech recognition isn\'t available in this browser — try Chrome, or tap a phrase'); return; }
  if(S.listening){ try{ recog && recog.stop(); }catch(e){} S.listening = false; render(); return; }
  try{
    recog = new SR(); recog.lang = 'en-GB'; recog.interimResults = true; recog.maxAlternatives = 1;
    let finalText = '';
    recog.onresult = ev => {
      let interim = '';
      for(let i = ev.resultIndex; i < ev.results.length; i++){
        const t = ev.results[i][0].transcript;
        if(ev.results[i].isFinal) finalText += t; else interim += t;
      }
      const ci = document.getElementById('chatInput'); if(ci) ci.value = finalText + interim;
    };
    recog.onerror = ev => { S.listening = false; render(); toast(ev.error === 'not-allowed' || ev.error === 'service-not-allowed' ? 'Microphone access is blocked here — tap a phrase or type instead' : 'Didn\'t catch that — try again'); };
    recog.onend = () => { S.listening = false; const t = finalText.trim(); render(); if(t) ask(t); };
    recog.start(); S.listening = true; render();
  }catch(e){ S.listening = false; render(); toast('Couldn\'t start the microphone — tap a phrase or type instead'); }
}

/* ---------- draft rewriting ---------- */
async function rewrite(id, instr, tone){
  const e = byId(id); if(!e) return;
  const cur = S.drafts[id] || {text:e.draftReply || '', tone:'Professional'};
  const preset = tone ? ReplyDraftService.preset(e, tone) : null;
  if(tone && preset){ S.drafts[id] = {text:preset, tone}; render({noFocus:true}); return; }
  const instruction = instr || `Rewrite in a ${tone.toLowerCase()} tone.`;
  if(S.mode === 'live'){
    S.drafts[id] = {...cur, busy:true, tone: tone || cur.tone}; render({noFocus:true});
    try{
      const r = await api('/api/rewrite', {method:'POST', body:{email:{fromName:e.from, fromEmail:e.fromEmail, subject:e.subject, body:e.body}, draft:cur.text, instruction}});
      S.drafts[id] = {text:r.text, tone: tone || cur.tone};
    }catch(err){ S.drafts[id] = {...cur, busy:false}; toast(err.message); }
    render({noFocus:true}); return;
  }
  if(SAMPLE){
    S.drafts[id] = {...cur, busy:true, tone: tone || cur.tone}; render({noFocus:true});
    try{
      const r = await SAMPLE(`Rewrite this email reply. Instruction: ${instruction}
Keep it a reply to the email below, keep facts consistent, sign it "${firstName()}". Return ONLY the new reply text, no preamble.

Email being replied to (from ${e.from}, ${e.org || ''}):
${e.body}

Current draft:
${cur.text}`, {modelTier:'quick', cache:false});
      S.drafts[id] = {text:r.text.trim(), tone: tone || cur.tone};
      render({noFocus:true}); return;
    }catch(err){ if(err && err.code === 'not_granted') SAMPLE = null; S.drafts[id] = {...cur, busy:false}; }
  }
  const local = ReplyDraftService.localRewrite(e, cur.text, instruction);
  if(local){ S.drafts[id] = {text:local, tone: tone || (/short/i.test(instruction) ? 'Short' : cur.tone)}; render({noFocus:true}); }
  else { S.drafts[id] = {...cur, busy:false}; render({noFocus:true}); toast('Live rewriting needs Claude access. Try a tone button, or "make it shorter".'); }
}

  if(t.id === 'draftText'){ const id = t.dataset.id; S.drafts[id] = {...(S.drafts[id] || {tone:'Professional'}), text:t.value}; }
  if(t.id === 'f-people'){ S.peopleInput = t.value; }

  if(t.dataset && t.dataset.who && S.whoCats){ const [i, k] = t.dataset.who.split(':'); if(S.whoCats[+i]) S.whoCats[+i][k] = t.value; }
  if(t.id === 'cfName' && S.catFlow){ S.catFlow.name = t.value; S.catFlow.pick = -1; S.catFlow.terms = null; S.catFlow.personal = false; }
  if(t.id === 'cfDesc' && S.catFlow){ S.catFlow.desc = t.value; S.catFlow.terms = null; S.catFlow.personal = false; }
  if(t.id === 'chatInput'){ t.style.height = 'auto'; t.style.height = Math.min(140, t.scrollHeight) + 'px'; }
});
document.addEventListener('mousedown', ev => { if(ev.target.closest('.ask-chips button')) ev.preventDefault(); });
document.addEventListener('change', ev => {
  const t = ev.target;
  if(t.dataset && t.dataset.cfm && S.catFlow){ const m = S.catFlow.matches.find(x => String(x.id) === t.dataset.cfm); if(m) m.checked = t.checked; const b = document.querySelector('[data-act="catCreate"]'); const n = S.catFlow.matches.filter(x => x.checked).length; if(b) b.textContent = `Create “${S.catFlow.name}”${n ? ` with ${n}` : ''}`; }
  if(t.id === 'cfAuto' && S.catFlow) S.catFlow.auto = t.checked;
});
let touchX = null;
document.addEventListener('touchstart', ev => { if(ev.target.closest('#cardArt')) touchX = ev.touches[0].clientX; }, {passive:true});
document.addEventListener('touchend', ev => { if(touchX == null) return; const dx = ev.changedTouches[0].clientX - touchX; touchX = null; if(Math.abs(dx) > 60) cardMove(dx < 0 ? 1 : -1); }, {passive:true});
document.addEventListener('keydown', ev => {
  const t = ev.target;
  if(t.id === 'chatInput' && ev.key === 'Enter' && !ev.shiftKey){ ev.preventDefault(); ask(t.value); }
  if(t.id === 'f-people' && ev.key === 'Enter'){ ev.preventDefault(); const v = t.value.trim(); if(v && !S.profile.people.includes(v)) S.profile.people.push(v); S.peopleInput = ''; render(); document.getElementById('f-people')?.focus(); }
  if(t.id === 'boardQ' && ev.key === 'Enter'){ ev.preventDefault(); const v = t.value.trim(); if(v) ask(v); }
  if(t.id === 'draftAsk' && ev.key === 'Enter'){ ev.preventDefault(); const v = t.value.trim(); if(v) rewrite(t.dataset.id, v, null); }
  if(S.view === 'app' && S.page === 'news' && S.newsView === 'cards' && !S.openId && !S.catFlow && !/INPUT|TEXTAREA/.test(t.tagName || '') && !ev.metaKey && !ev.ctrlKey){
    if(ev.key === 'ArrowRight'){ ev.preventDefault(); cardMove(1); return; }
    if(ev.key === 'ArrowLeft'){ ev.preventDefault(); cardMove(-1); return; }
    if(ev.key === 'r' || ev.key === 'R'){ const it = deckItems()[S.cardIdx || 0]; if(it){ ev.preventDefault(); cardToggleRead(it.id); } return; }
  }
  if(ev.key === '/' && S.view === 'app' && S.page === 'board' && !S.openId && !S.catFlow && !/INPUT|TEXTAREA/.test(t.tagName || '')){ ev.preventDefault(); document.getElementById('chatInput')?.focus(); return; }
  if(ev.key === 'Escape' && S.page === 'board' && S.askOpen && !S.openId && !S.catFlow){ S.askOpen = false; render({noFocus:true}); return; }
  if(ev.key === 'Enter' && S.imapForm && (t.id === 'imapPass' || t.id === 'imapEmail')){ ev.preventDefault(); ACT.imapSubmit(); return; }
  if(ev.key === 'Escape' && S.imapForm){ ACT.imapCancel(); return; }
  if(S.workForm && ev.key === 'Enter' && /^wk(Email|Host|Pass)$/.test(t.id)){ ev.preventDefault(); if(S.workForm.step === 'email') ACT.workCheck(); else ACT.workSubmit(); return; }
  if(ev.key === 'Escape' && S.workForm){ ACT.workCancel(); return; }
  if(ev.key === 'Escape' && S.catFlow){ ACT.catCancel(); return; }
  if(ev.key === 'Escape'){ if(S.catchup){ ACT.closeCatch(); } else if(S.openId){ ACT.close(); } else if(S.navOpen){ ACT.navClose(); } }
});

/* boot */
(async function boot(){
  if(S.mode === 'live'){ if(S.view === 'app') S.view = 'landing'; S.profile = store.get('liveProfile', null) || S.profile; }
  else if(S.view === 'app'){ if(connectedAccs().length) runPipeline(); else S.view = 'landing'; }
  render();
  try{ const h = await api('/api/health'); if(h && h.app === 'clearday'){ LIVE.available = true; LIVE.ai = h.ai; LIVE.aiProvider = h.aiProvider; LIVE.voice = !!h.voice; LIVE.providers = h.providers || {}; } }catch(e){}
  if(!LIVE.available){ if(S.mode === 'live'){ S.mode = 'demo'; S.profile = store.get('profile', null) || defaultProfile(); render(); } return; }
  const qs = new URLSearchParams(location.search);
  let me = null; try{ me = await api('/api/me'); }catch(e){}
  if(qs.has('connected') || qs.has('auth_error')){
    history.replaceState(null, '', location.pathname);
    S.mode = 'live'; store.set('mode', 'live'); S.cats = store.get('cats:live', []);
    S.profile = store.get('liveProfile', null) || me?.profile || blankProfile();
    setLiveAccounts(me?.accounts || []);
    S.view = 'connect'; render({top:true});
    toast(qs.get('auth_error') ? `Couldn't connect: ${qs.get('auth_error')}` : `${accById(qs.get('connected'))?.name || 'Inbox'} connected`);
    return;
  }
  if(S.mode === 'live' && me?.accounts?.length){
    S.profile = me.profile || S.profile;
    setLiveAccounts(me.accounts);
    analyze();
    return;
  }
  render();
})();
</script>
<script type="module">
/* ---------- Gemini Live voice (browser <-> Gemini directly via ephemeral token) ---------- */
const LV = { session:null, state:'idle', stream:null, inCtx:null, outCtx:null, node:null, playAt:0, sources:new Set(), handle:null, inTxt:'', outTxt:'', log:[], closing:false, retries:0 };
const setState = s => { LV.state = s; window.dispatchEvent(new CustomEvent('livevoice', {detail:s})); };
const b64 = buf => { let s = ''; const u = new Uint8Array(buf); for(let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = str => { const s = atob(str), u = new Uint8Array(s.length); for(let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u.buffer; };

function playChunk(data){
  const pcm = new Int16Array(data), f = new Float32Array(pcm.length);
  for(let i = 0; i < pcm.length; i++) f[i] = pcm[i] / 32768;
  const buf = LV.outCtx.createBuffer(1, f.length, 24000); buf.copyToChannel(f, 0);
  const src = LV.outCtx.createBufferSource(); src.buffer = buf; src.connect(LV.outCtx.destination);
  LV.playAt = Math.max(LV.playAt, LV.outCtx.currentTime + 0.02); src.start(LV.playAt); LV.playAt += buf.duration;
  LV.sources.add(src); src.onended = () => { LV.sources.delete(src); if(!LV.sources.size && LV.state === 'speaking') setState('listening'); };
  setState('speaking');
}
function stopPlayback(){ LV.sources.forEach(s => { try{ s.stop(); }catch(e){} }); LV.sources.clear(); LV.playAt = 0; }

async function startMic(){
  LV.stream = await navigator.mediaDevices.getUserMedia({audio:{channelCount:1, echoCancellation:true, noiseSuppression:true, autoGainControl:true}});
  LV.inCtx = new AudioContext({sampleRate:16000});
  const code = `class P extends AudioWorkletProcessor{process(i){const c=i[0][0];if(c){const o=new Int16Array(c.length);for(let k=0;k<c.length;k++){const v=Math.max(-1,Math.min(1,c[k]));o[k]=v<0?v*32768:v*32767}this.port.postMessage(o.buffer,[o.buffer])}return true}}registerProcessor('pcm',P)`;
  await LV.inCtx.audioWorklet.addModule(URL.createObjectURL(new Blob([code], {type:'application/javascript'})));
  LV.node = new AudioWorkletNode(LV.inCtx, 'pcm');
  LV.node.port.onmessage = e => { if(LV.session && !LV.muted) try{ LV.session.sendRealtimeInput({audio:{data:b64(e.data), mimeType:'audio/pcm;rate=16000'}}); }catch(err){} };
  LV.inCtx.createMediaStreamSource(LV.stream).connect(LV.node);
}

function flushTurn(){
  const u = LV.inTxt.trim(), a = LV.outTxt.trim(); LV.inTxt = ''; LV.outTxt = '';
  window.dispatchEvent(new CustomEvent('livevoice-turn', {detail:{user:u, ai:a}}));
  if(u) LV.log.push('User: ' + u); if(a) LV.log.push('Assistant: ' + a);
}

async function onMessage(m){
  const sc = m.serverContent;
  if(m.sessionResumptionUpdate?.newHandle) LV.handle = m.sessionResumptionUpdate.newHandle;
  if(m.goAway && !LV.closing){ reconnect(); return; }
  if(m.toolCall){
    const out = [];
    for(const fc of m.toolCall.functionCalls){
      let result;
      try{
        const r = await fetch('/api/live/tool', {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({name:fc.name, args:fc.args || {}})});
        const j = await r.json(); result = j.result || {error:'no result'};
        window.dispatchEvent(new CustomEvent('livevoice-tool', {detail:{name:fc.name, ui:j.ui || null}}));
      }catch(e){ result = {error:'tool failed: ' + e.message}; }
      out.push({id:fc.id, name:fc.name, response:{result}});
    }
    LV.session.sendToolResponse({functionResponses:out});
  }
  if(!sc) return;
  if(sc.interrupted){ stopPlayback(); if(LV.outTxt) flushTurn(); setState('listening'); }
  if(sc.inputTranscription?.text){ if(LV.outTxt) flushTurn(); LV.inTxt += sc.inputTranscription.text; }
  if(sc.outputTranscription?.text) LV.outTxt += sc.outputTranscription.text;
  for(const p of sc.modelTurn?.parts || []) if(p.inlineData?.data && /audio/.test(p.inlineData.mimeType || '')) playChunk(unb64(p.inlineData.data));
  if(sc.turnComplete) flushTurn();
}

async function connect(){
  const r = await fetch('/api/live/token', {method:'POST'});
  const t = await r.json(); if(!r.ok) throw new Error(t.error || 'Could not start voice');
  const {GoogleGenAI} = await import('https://esm.sh/@google/genai');
  const ai = new GoogleGenAI({apiKey:t.token, httpOptions:{apiVersion:'v1alpha'}});
  const config = {...t.config, ...(LV.handle ? {sessionResumption:{handle:LV.handle}} : {})};
  LV.session = await ai.live.connect({model:t.model, config, callbacks:{
    onopen(){},
    onmessage(m){ onMessage(m).catch(console.error); },
    onerror(e){ console.error('live error', e); },
    onclose(e){ if(!LV.closing){ if(LV.retries++ < 2) reconnect(); else { stop(); window.dispatchEvent(new CustomEvent('livevoice-error', {detail:(e && e.reason) || 'Voice session ended'})); } } },
  }});
}
async function reconnect(){
  try{ const old = LV.session; LV.session = null; try{ old && old.close(); }catch(e){} await connect(); }
  catch(e){ stop(); window.dispatchEvent(new CustomEvent('livevoice-error', {detail:e.message})); }
}

async function start(){
  if(LV.session || LV.state === 'connecting') return;
  LV.closing = false; LV.log = []; LV.inTxt = LV.outTxt = ''; LV.handle = null; LV.retries = 0; LV.muted = false;
  setState('connecting');
  try{
    LV.outCtx = new AudioContext({sampleRate:24000}); await LV.outCtx.resume();
    await startMic();
    await connect();
    setState('listening');
    // Greet with a spoken briefing.
    LV.session.sendClientContent({turns:[{role:'user', parts:[{text:'(The user just opened voice mode. Greet them briefly by calling get_briefing and telling them the 2-3 things that matter most. Then ask how you can help.)'}]}], turnComplete:true});
  }catch(e){ stop(); window.dispatchEvent(new CustomEvent('livevoice-error', {detail:/Permission|NotAllowed/i.test(e.name + e.message) ? 'Microphone access is blocked. Allow it in your browser.' : e.message})); }
}
function stop(){
  LV.closing = true;
  try{ LV.session && LV.session.close(); }catch(e){}
  LV.session = null; stopPlayback();
  try{ LV.node && LV.node.disconnect(); LV.stream && LV.stream.getTracks().forEach(t => t.stop()); LV.inCtx && LV.inCtx.close(); LV.outCtx && LV.outCtx.close(); }catch(e){}
  LV.node = LV.stream = LV.inCtx = LV.outCtx = null;
  const transcript = LV.log.join('\n'); LV.log = [];
  if(transcript.length > 80) fetch('/api/live/summary', {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({transcript})}).catch(() => {});
  setState('idle');
}
window.LiveVoice = { start, stop, get state(){ return LV.state; }, toggleMute(){ LV.muted = !LV.muted; return LV.muted; } };
window.dispatchEvent(new Event('livevoice-ready'));
</script>
