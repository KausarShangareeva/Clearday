<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clearday — an AI chief of staff for your email</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F4F5F7; --surface:#FFFFFF; --sunk:#ECEEF1; --hover:#F0F2F5;
  --ink:#171A20; --ink2:#4B5260; --ink3:#878D99;
  --line:#E2E5EA; --line2:#D0D5DC;
  --accent:#3446C7; --accent-ink:#FFFFFF; --accent-soft:#E9ECFA;
  --ai:#F4F2FC; --ai-line:#DFD9F4; --ai-ink:#4E3FA8;
  --crit:#D2343D; --imp:#C27C05; --norm:#7B8494; --low:#B2B8C2; --noise:#D2D6DD;
  --acc-personal:#8B5CD6; --acc-university:#1F8A66; --acc-startup:#E0602A; --acc-work:#2C74D6;
  --ok:#1F8A66;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --shadow:0 1px 2px rgba(20,24,40,.06),0 8px 24px rgba(20,24,40,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14161B; --surface:#1B1E24; --sunk:#22262D; --hover:#23272F;
    --ink:#ECEEF2; --ink2:#B4BAC5; --ink3:#7D8491;
    --line:#2A2E36; --line2:#363B45;
    --accent:#8C9AFF; --accent-ink:#11131A; --accent-soft:#252A44;
    --ai:#1F1D2C; --ai-line:#332E4E; --ai-ink:#B9AEFF;
    --crit:#F0626A; --imp:#E6A93A; --norm:#8E97A6; --low:#5E6573; --noise:#454B56;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14161B; --surface:#1B1E24; --sunk:#22262D; --hover:#23272F;
  --ink:#ECEEF2; --ink2:#B4BAC5; --ink3:#7D8491;
  --line:#2A2E36; --line2:#363B45;
  --accent:#8C9AFF; --accent-ink:#11131A; --accent-soft:#252A44;
  --ai:#1F1D2C; --ai-line:#332E4E; --ai-ink:#B9AEFF;
  --crit:#F0626A; --imp:#E6A93A; --norm:#8E97A6; --low:#5E6573; --noise:#454B56;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 0}
#app{height:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
img{max-width:100%}
h1,h2,h3,p{margin:0}
.muted{color:var(--ink3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;font-weight:500;border:1px solid var(--line2);background:var(--surface);transition:background .15s,border-color .15s}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{opacity:.9}
.btn.accent{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{height:32px;padding:0 12px;font-size:13.5px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);font-size:14px;transition:all .15s}
.chip:hover{border-color:var(--ink3)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.sm{height:28px;font-size:13px;padding:0 10px}
.acc-dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none;display:inline-block}
.pdot{width:8px;height:8px;border-radius:50%;flex:none}
.p-critical{--pc:var(--crit)}.p-important{--pc:var(--imp)}.p-normal{--pc:var(--norm)}.p-low{--pc:var(--low)}.p-noise{--pc:var(--noise)}
.pdot{background:var(--pc)}
.ptag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--pc)}
.ptag::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--pc)}
.spark{color:var(--ai-ink)}
.k{font-size:12.5px;color:var(--ink3);margin-bottom:4px}

/* ---------- Landing ---------- */
.landing{min-height:100%;overflow:auto;height:100%}
.l-nav{display:flex;align-items:center;justify-content:space-between;max-width:1120px;margin:0 auto;padding:22px 24px}
.logo{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:-.01em;font-size:16px}
.logo-mark{width:22px;height:22px;border-radius:7px;background:var(--ink);position:relative;flex:none}
.logo-mark::after{content:"";position:absolute;inset:6px 5px 10px 5px;border-radius:2px;background:var(--bg)}
.hero{max-width:1120px;margin:0 auto;padding:56px 24px 40px;display:grid;grid-template-columns:1.15fr 1fr;gap:56px;align-items:center}
.hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(42px,6vw,72px);line-height:1.02;letter-spacing:-.025em;max-width:11ch}
.hero p.sub{margin-top:22px;font-size:18px;color:var(--ink2);max-width:46ch;line-height:1.55}
.hero .ctas{display:flex;gap:10px;margin-top:30px;flex-wrap:wrap}
.hero .note{margin-top:14px;font-size:13px;color:var(--ink3)}
.funnel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)}
.funnel-in{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.f-inbox{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink2);padding:6px 0}
.f-inbox b{margin-left:auto;font-weight:500;color:var(--ink3);font-variant-numeric:tabular-nums}
.f-arrow{display:flex;align-items:center;gap:10px;margin:14px 0;color:var(--ink3);font-size:13px}
.f-arrow::before,.f-arrow::after{content:"";height:1px;background:var(--line);flex:1}
.f-out{font-family:var(--serif);font-size:24px;line-height:1.3;letter-spacing:-.01em}
.f-out .n{font-family:var(--sans);font-weight:600;font-size:.82em;font-variant-numeric:tabular-nums}
.f-items{margin-top:14px;display:grid;gap:8px}
.f-item{display:flex;align-items:center;gap:10px;font-size:14px;padding:10px 12px;border-radius:10px;background:var(--bg)}
.how{max-width:1120px;margin:0 auto;padding:32px 24px 72px}
.how-steps{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border-top:1px solid var(--line)}
.how-step{padding:20px 16px 0 0;position:relative}
.how-step h3{font-size:15px;font-weight:600;margin-bottom:6px}
.how-step p{font-size:14px;color:var(--ink2);max-width:24ch}
.how-step::before{content:"";position:absolute;top:-5px;left:0;width:9px;height:9px;border-radius:50%;background:var(--ink)}
.l-foot{max-width:1120px;margin:0 auto;padding:0 24px 40px;font-size:13px;color:var(--ink3);display:flex;gap:20px;flex-wrap:wrap}
.l-foot button{text-decoration:underline;color:var(--ink2)}

/* ---------- Onboarding / setup ---------- */
.setup{height:100%;overflow:auto;display:flex;flex-direction:column}
.setup-top{display:flex;align-items:center;justify-content:space-between;padding:20px 24px}
.progress{height:3px;background:var(--line);border-radius:3px;overflow:hidden;width:160px}
.progress i{display:block;height:100%;background:var(--ink);transition:width .35s ease}
.setup-body{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:32px 24px 48px}
.q{width:100%;max-width:620px}
.q h2{font-family:var(--serif);font-weight:400;font-size:clamp(30px,4vw,40px);line-height:1.12;letter-spacing:-.02em}
.q .hint{margin-top:10px;color:var(--ink2);font-size:16px;max-width:52ch}
.q .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px}
.q label.field{display:block;margin-top:26px}
.q label.field span{display:block;font-size:13.5px;color:var(--ink2);margin-bottom:6px}
.input{width:100%;height:44px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);padding:0 14px;font-size:15px}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.input{height:auto;padding:12px 14px;line-height:1.55;resize:vertical}
.tokens{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.token{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 6px 0 12px;border-radius:8px;background:var(--sunk);font-size:14px}
.token button{width:22px;height:22px;border-radius:6px;color:var(--ink3);font-size:15px;line-height:1}
.token button:hover{background:var(--line);color:var(--ink)}
.q-actions{display:flex;align-items:center;gap:10px;margin-top:36px}
.q-actions .spacer{flex:1}
.profile-out{margin-top:28px;border:1px solid var(--ai-line);background:var(--ai);border-radius:16px;padding:22px}
.profile-out .who{font-weight:600;font-size:16px}
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:18px}
.tiers h4{margin:0 0 8px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:7px}
.tiers ul{margin:0;padding:0;list-style:none;font-size:14px;color:var(--ink2);display:grid;gap:4px}
.cats-preview{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.acc-list{margin-top:26px;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.acc-row{display:flex;align-items:center;gap:14px;padding:16px 18px;border-top:1px solid var(--line)}
.acc-row:first-child{border-top:0}
.acc-ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--sunk);font-weight:600;font-size:13px;color:var(--ink2);flex:none;position:relative}
.acc-ico .acc-dot{position:absolute;right:-2px;bottom:-2px;width:11px;height:11px;border:2px solid var(--surface)}
.acc-meta{flex:1;min-width:0}
.acc-meta b{display:block;font-weight:500}
.acc-meta span{font-size:13.5px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.status-ok{color:var(--ok);font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.oauth-note{margin-top:14px;font-size:13px;color:var(--ink3);display:flex;gap:8px}
.analyze{height:100%;display:grid;place-items:center;padding:24px}
.analyze-box{max-width:460px;width:100%}
.analyze h2{font-family:var(--serif);font-weight:400;font-size:34px;letter-spacing:-.02em;line-height:1.15}
.a-steps{margin:28px 0 0;padding:0;list-style:none;display:grid;gap:14px}
.a-steps li{display:flex;align-items:center;gap:12px;color:var(--ink3);transition:color .3s}
.a-steps li.on{color:var(--ink)}
.a-steps li .ic{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;font-size:11px;flex:none;transition:all .3s}
.a-steps li.on .ic{border-color:var(--ink);}
.a-steps li.done .ic{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.a-steps li.on:not(.done) .ic{border-top-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- App shell ---------- */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);height:100%}
.side{border-right:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;padding:16px 12px;gap:2px;overflow:auto}
.side .logo{padding:6px 10px 18px}
.nav-i{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:8px;font-size:14px;color:var(--ink2);width:100%;text-align:left}
.nav-i:hover{background:var(--hover);color:var(--ink)}
.nav-i.on{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:0 0 0 1px var(--line)}
.nav-i .count{margin-left:auto;font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.nav-i .ni{width:18px;text-align:center;color:var(--ink3);font-size:14px}
.nav-i.on .ni{color:var(--ink)}
.nav-sep{height:1px;background:var(--line);margin:10px 10px}
.side-accs{display:grid;gap:2px;margin-top:2px}
.side-acc{display:flex;align-items:center;gap:10px;height:30px;padding:0 10px;border-radius:8px;font-size:13.5px;color:var(--ink2)}
.side-acc.off{opacity:.45}
.side-acc:hover{background:var(--hover)}
.side-bottom{margin-top:auto;padding-top:12px}
.main{overflow:auto;height:100%;position:relative}
.page{max-width:880px;margin:0 auto;padding:36px 32px 120px}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.page-h h1{font-family:var(--serif);font-weight:400;font-size:34px;letter-spacing:-.02em;line-height:1.1}
.page-h p{color:var(--ink2);margin-top:6px}
.topbar{display:none}

/* Briefing */
.brief-date{font-size:13.5px;color:var(--ink3);margin-bottom:14px}
.brief-sentence{font-family:var(--serif);font-weight:400;font-size:clamp(30px,4.2vw,46px);line-height:1.16;letter-spacing:-.022em;max-width:23ch}
.brief-sentence .n{font-family:var(--sans);font-weight:600;font-size:.8em;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.brief-sentence .soft{color:var(--ink3)}
.brief-actions{display:flex;align-items:center;gap:14px;margin-top:28px;flex-wrap:wrap}
.catch-btn{height:52px;padding:0 24px;border-radius:14px;background:var(--ink);color:var(--bg);font-weight:600;font-size:15.5px;display:inline-flex;align-items:center;gap:10px;transition:transform .15s}
.catch-btn:hover{transform:translateY(-1px)}
.catch-btn .spark{color:inherit;opacity:.8}
.stats{display:flex;gap:28px;margin-top:34px;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);flex-wrap:wrap}
.stat b{display:block;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat span{font-size:13px;color:var(--ink3)}
.sec{margin-top:40px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.sec-h h2{font-size:16px;font-weight:600;letter-spacing:-.005em}
.sec-h .link{font-size:13.5px;color:var(--ink3)}
.sec-h .link:hover{color:var(--ink)}

/* action items */
.todo{display:grid}
.todo-i{display:flex;align-items:flex-start;gap:14px;padding:14px 4px;border-top:1px solid var(--line)}
.todo-i:last-child{border-bottom:1px solid var(--line)}
.check{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line2);flex:none;margin-top:2px;display:grid;place-items:center;font-size:12px;color:transparent;transition:all .15s}
.check:hover{border-color:var(--ink)}
.todo-i.done .check{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.todo-i.done .todo-t{text-decoration:line-through;color:var(--ink3)}
.todo-body{flex:1;min-width:0;text-align:left}
.todo-t{font-weight:500}
.todo-s{font-size:13.5px;color:var(--ink3);display:flex;gap:10px;align-items:center;margin-top:2px;flex-wrap:wrap}
.due{font-size:12.5px;font-weight:500;padding:2px 8px;border-radius:6px;background:var(--sunk);color:var(--ink2);white-space:nowrap}
.due.hot{background:color-mix(in srgb,var(--crit) 12%,transparent);color:var(--crit)}

/* email rows */
.list{display:grid}
.row{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:14px;align-items:start;padding:14px 10px;border-top:1px solid var(--line);text-align:left;width:100%;border-radius:0;transition:background .12s}
.row:hover{background:var(--hover)}
.list .row:last-child{border-bottom:1px solid var(--line)}
.row .pdot{margin-top:7px}
.row-top{display:flex;align-items:center;gap:8px;min-width:0}
.sender{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.org{font-size:13px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subject{display:block;margin-top:1px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14.5px}
.ai-line{display:block;margin-top:3px;font-size:13.5px;color:var(--ink2);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ai-line .spark{margin-right:6px;font-size:12px}
.row-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.time{font-size:12.5px;color:var(--ink3);white-space:nowrap;font-variant-numeric:tabular-nums}
.row.dim .sender,.row.dim .subject{color:var(--ink3);font-weight:400}

/* news */
.news{display:grid;gap:0}
.news-i{padding:18px 0;border-top:1px solid var(--line)}
.news-i:last-child{border-bottom:1px solid var(--line)}
.news-src{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink3)}
.news-i h3{font-family:var(--serif);font-weight:500;font-size:21px;letter-spacing:-.01em;line-height:1.25;margin-top:6px;text-align:left}
.news-i h3 button{text-align:left}
.news-i h3 button:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.news-sum{margin-top:8px;color:var(--ink2);max-width:68ch}
.news-why{margin-top:10px;font-size:14px;display:flex;gap:8px;color:var(--ink2);max-width:68ch}
.news-why b{color:var(--ai-ink);font-weight:500;white-space:nowrap}
.readtime{font-size:12.5px;color:var(--ink3)}
.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{height:28px;padding:0 10px;border-radius:7px;font-size:13px;color:var(--ink2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:500}

/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{position:relative;flex:1;min-width:200px;max-width:320px}
.search input{padding-left:34px;height:36px;font-size:14px}
.search::before{content:"⌕";position:absolute;left:12px;top:50%;transform:translateY(-52%);color:var(--ink3);font-size:16px}
.empty{padding:48px 0;text-align:center;color:var(--ink3)}
.empty b{display:block;color:var(--ink);font-weight:500;margin-bottom:4px}

/* categories */
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.cat{border:1px solid var(--line);border-radius:12px;padding:16px;text-align:left;background:var(--surface);transition:border-color .15s}
.cat:hover{border-color:var(--ink3)}
.cat.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.cat .ce{font-size:20px}
.cat b{display:block;margin-top:8px;font-weight:500}
.cat span{font-size:13px;color:var(--ink3)}
.ai-note{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink2);background:var(--ai);border:1px solid var(--ai-line);border-radius:12px;padding:12px 14px;margin-bottom:18px}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(15,18,26,.28);z-index:40;animation:fade .2s ease}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--surface);z-index:50;box-shadow:-12px 0 40px rgba(15,18,26,.12);display:flex;flex-direction:column;animation:slide .26s cubic-bezier(.2,.8,.2,1);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
.sheet-bar{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.sheet-bar .acc-label{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink2);flex:1;min-width:0}
.sheet-bar .acc-label span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--ink2);font-size:18px}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.sheet-scroll{overflow:auto;flex:1;padding:22px 24px 40px}
.subj{font-family:var(--serif);font-weight:500;font-size:26px;letter-spacing:-.015em;line-height:1.2}
.from{margin-top:12px;display:flex;flex-wrap:wrap;gap:4px 10px;font-size:14px;align-items:baseline}
.from b{font-weight:500}
.from span{color:var(--ink3)}
.ai{margin-top:22px;background:var(--ai);border:1px solid var(--ai-line);border-radius:16px;padding:18px 18px 20px}
.ai-head{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--ai-ink);margin-bottom:14px}
.ai-grid{display:grid;grid-template-columns:130px 1fr;gap:16px;padding-bottom:16px;border-bottom:1px solid var(--ai-line)}
.why{margin:0;padding:0;list-style:none;display:grid;gap:5px;font-size:14px}
.why li{display:flex;gap:8px}
.why li::before{content:"✓";color:var(--ai-ink);font-size:12px;margin-top:2px}
.ai-block{padding-top:16px}
.ai-block p{font-size:15px}
.ai-block + .ai-block{margin-top:2px}
.action-box{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;background:var(--surface);border-radius:10px;border:1px solid var(--ai-line)}
.action-box .ab-t{font-weight:500}
.action-box .ab-s{font-size:13.5px;color:var(--ink2)}
.draft{margin-top:6px;background:var(--surface);border:1px solid var(--ai-line);border-radius:12px;overflow:hidden}
.draft textarea{width:100%;border:0;background:transparent;padding:14px 16px;min-height:190px;resize:vertical;line-height:1.6;font-size:14.5px}
.draft textarea:focus{outline:none}
.draft-tools{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-top:1px solid var(--line);align-items:center}
.draft-ask{display:flex;gap:6px;padding:0 12px 12px}
.draft-ask input{height:34px;font-size:13.5px}
.draft-foot{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.never{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--ink2);margin-top:12px}
.never::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok);margin-top:7px;flex:none}
.busy-line{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ai-ink);padding:6px 12px}
.dots{display:inline-flex;gap:3px}
.dots i{width:5px;height:5px;border-radius:50%;background:currentColor;animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.correct{margin-top:18px}
.correct .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.original{margin-top:28px;padding-top:20px;border-top:1px solid var(--line)}
.original .body{white-space:pre-wrap;font-size:15px;line-height:1.65;color:var(--ink);max-width:66ch}
.event-box{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--ai-line);border-radius:10px;flex-wrap:wrap}
.cal{width:42px;height:46px;border-radius:9px;border:1px solid var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;line-height:1}
.cal small{font-size:10.5px;color:var(--crit);font-weight:600}
.cal b{font-size:18px;font-weight:600;margin-top:3px}

/* modal */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px}
.modal-card{position:relative;background:var(--surface);border-radius:20px;width:min(640px,100%);max-height:calc(100% - 20px);overflow:auto;box-shadow:0 30px 80px rgba(10,12,20,.25);animation:pop .25s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}}
.modal-in{padding:28px 30px 26px}
.cu-h{font-family:var(--serif);font-weight:400;font-size:32px;letter-spacing:-.02em;line-height:1.15}
.cu-sub{margin-top:8px;color:var(--ink2)}
.cu-list{margin:22px 0 0;padding:0;list-style:none;counter-reset:cu}
.cu-list li{display:grid;grid-template-columns:28px 1fr;gap:6px;padding:12px 0;border-top:1px solid var(--line);counter-increment:cu}
.cu-list li::before{content:counter(cu);font-size:13px;color:var(--ink3);font-variant-numeric:tabular-nums;padding-top:2px}
.cu-list .cu-cat{font-size:13px;color:var(--ink3);display:flex;gap:6px;align-items:center}
.cu-list button{text-align:left}
.cu-list button:hover .cu-text{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.cu-text{font-size:15.5px;margin-top:2px}
.modal-foot{display:flex;gap:8px;justify-content:space-between;align-items:center;padding:16px 30px;border-top:1px solid var(--line);flex-wrap:wrap}

/* assistant */
.chat-page{display:flex;flex-direction:column;height:100%}
.chat-scroll{flex:1;overflow:auto}
.chat-inner{max-width:760px;margin:0 auto;padding:36px 28px 24px}
.chat-hello h1{font-family:var(--serif);font-weight:400;font-size:36px;letter-spacing:-.02em;line-height:1.1}
.chat-hello p{color:var(--ink2);margin-top:8px;max-width:54ch}
.suggest{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.msg{margin-top:22px;display:flex}
.msg.user{justify-content:flex-end}
.msg.user .bubble{background:var(--ink);color:var(--bg);border-radius:16px 16px 4px 16px;padding:10px 14px;max-width:80%}
.msg.bot .bubble{max-width:100%;width:100%}
.msg.bot .who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ai-ink);font-weight:500;margin-bottom:6px}
.answer{font-size:15.5px;line-height:1.6}
.answer p+p,.answer p+ol,.answer ol+p{margin-top:8px}
.answer ol{margin:6px 0 0;padding-left:22px}
.answer li{margin:3px 0}
.refs{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.ref{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:13px;max-width:100%}
.ref:hover{border-color:var(--ink3)}
.ref span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px}
.chat-draft{margin-top:12px;border:1px solid var(--ai-line);background:var(--ai);border-radius:12px;padding:14px 16px}
.chat-draft pre{white-space:pre-wrap;font-family:inherit;margin:8px 0 0;font-size:14.5px;line-height:1.6}
.composer-wrap{border-top:1px solid var(--line);background:var(--bg)}
.composer{max-width:760px;margin:0 auto;padding:14px 28px 18px}
.composer-box{display:flex;align-items:flex-end;gap:8px;background:var(--surface);border:1px solid var(--line2);border-radius:16px;padding:8px 8px 8px 16px;box-shadow:var(--shadow)}
.composer-box textarea{flex:1;border:0;background:transparent;resize:none;min-height:24px;max-height:140px;padding:8px 0;line-height:1.5;font-size:15px}
.composer-box textarea:focus{outline:none}
.mic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink2);flex:none;position:relative}
.mic:hover{background:var(--hover)}
.mic.live{background:var(--crit);color:#fff}
.mic.live::after{content:"";position:absolute;inset:-4px;border-radius:15px;border:2px solid var(--crit);animation:pulse 1.4s infinite}
@keyframes pulse{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(1.25)}}
.send{width:40px;height:40px;border-radius:12px;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:none}
.send[disabled]{opacity:.3}
.composer-meta{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--ink3);margin-top:8px;flex-wrap:wrap}
.voice-banner{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--ink2);margin-bottom:10px;flex-wrap:wrap}

/* privacy */
.prose{max-width:68ch}
.prose h2{font-size:17px;font-weight:600;margin-top:30px}
.prose p{margin-top:8px;color:var(--ink2)}
.pipeline{margin-top:16px;display:grid;gap:0;padding:0;list-style:none;counter-reset:pl}
.pipeline li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px;counter-increment:pl;align-items:baseline}
.pipeline li::before{content:counter(pl);color:var(--ink3);font-size:12.5px;font-variant-numeric:tabular-nums}
.pipeline code{font-size:12.5px;color:var(--ink3);background:var(--sunk);padding:2px 6px;border-radius:5px;font-family:ui-monospace,Menlo,monospace}
.facts{display:grid;gap:10px;margin-top:14px}
.fact{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:14.5px}
.fact .fi{color:var(--ok);font-weight:600}
.warn{margin-top:24px;padding:14px 16px;border-radius:12px;background:color-mix(in srgb,var(--imp) 12%,transparent);color:var(--ink);font-size:14.5px}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;z-index:80;max-width:min(520px,calc(100% - 32px));box-shadow:0 10px 30px rgba(0,0,0,.2);animation:toast .25s ease}
@keyframes toast{from{opacity:0;transform:translate(-50%,8px)}}

/* settings */
.set-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 0;border-top:1px solid var(--line)}
.set-row:last-child{border-bottom:1px solid var(--line)}
.set-row b{font-weight:500;display:block}
.set-row span{font-size:13.5px;color:var(--ink3)}
.switch{width:40px;height:24px;border-radius:999px;background:var(--line2);position:relative;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch.on{background:var(--ok)}
.switch.on::after{transform:translateX(16px)}

/* board */
:root{--board:#F2F3F5;--dot:#CBD0D7;--folder:#FBFBFC;--folder2:#EFF1F4;--glass:rgba(255,255,255,.66);--glass-line:rgba(255,255,255,.9);--paper-replied:#E3E5E9}
:root[data-theme="dark"]{--board:#16181D;--dot:#30343C;--folder:#252930;--folder2:#1F2228;--glass:rgba(40,44,52,.62);--glass-line:rgba(255,255,255,.08);--paper-replied:#2C3038}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--board:#16181D;--dot:#30343C;--folder:#252930;--folder2:#1F2228;--glass:rgba(40,44,52,.62);--glass-line:rgba(255,255,255,.08);--paper-replied:#2C3038}}
.board-btn{height:52px;border-radius:14px;padding:0 20px}
.main-board{background-color:var(--board);background-image:radial-gradient(circle,var(--dot) 1px,transparent 1.3px);background-size:22px 22px;background-attachment:local}
.board{min-height:100%}
.board-in{max-width:1080px;margin:0 auto;padding:34px 32px 120px}
.board-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.board-head h1{font-family:var(--serif);font-weight:400;font-size:36px;letter-spacing:-.02em;line-height:1.1}
.board-sum{margin-top:8px;color:var(--ink2);font-size:16px}
.board-sum b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.board-head .back{margin-left:-10px}
.board-controls{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:22px;flex-wrap:wrap}
.board-inboxes{display:flex;gap:6px;flex-wrap:wrap}
.chip.on-soft{background:var(--surface);border-color:color-mix(in srgb,var(--c) 45%,var(--line2));box-shadow:0 1px 2px rgba(20,24,40,.06)}
.chip.off{background:transparent;color:var(--ink3);border-style:dashed}
.chip.off .acc-dot{background:var(--low)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:12.5px;color:var(--ink3)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.lg{width:14px;height:10px;border-radius:3px;display:inline-block}
.lg.awaiting{background:linear-gradient(90deg,var(--acc-personal),var(--acc-university),var(--acc-startup),var(--acc-work))}
.lg.replied{background:var(--paper-replied);border:1px solid var(--line2)}
.lg.fyi{background:var(--surface);border:1px solid var(--line2)}
.lg.unread{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.board-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:52px 28px;margin-top:50px}
.folder-wrap{display:flex;flex-direction:column;align-items:center;text-align:center;border-radius:22px}
.folder-wrap:focus-visible{outline-offset:8px}
.f-name{margin-top:16px;font-weight:600;font-size:17px;letter-spacing:-.01em}
.f-meta{margin-top:3px;font-size:13.5px;color:var(--ink3);display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.mini-meter{width:44px;height:4px;border-radius:4px;background:var(--line);overflow:hidden;display:inline-block}
.mini-meter i{display:block;height:100%;border-radius:4px}
.folder{position:relative;width:100%;aspect-ratio:1.22/1;display:block}
.f-back{position:absolute;left:0;right:0;bottom:0;top:13%;background:linear-gradient(180deg,var(--folder),var(--folder2));border-radius:22px;box-shadow:0 1px 0 var(--glass-line) inset,0 1px 3px rgba(20,24,40,.07)}
.f-back::before{content:"";position:absolute;left:0;top:-15px;width:42%;height:34px;background:var(--folder);border-radius:18px 18px 0 0}
.f-papers{position:absolute;left:6%;right:6%;top:2%;bottom:36%}
.paper{position:absolute;top:0;left:var(--l);width:46%;height:100%;border-radius:10px;background:var(--surface);box-shadow:0 2px 8px rgba(20,24,40,.12),0 0 0 1px rgba(20,24,40,.04);padding:9px 9px 0;transform:rotate(var(--r));transform-origin:50% 100%;transition:transform .35s cubic-bezier(.2,.8,.2,1);text-align:left;overflow:hidden;display:flex;flex-direction:column;gap:6px}
.paper.awaiting{background:color-mix(in srgb,var(--c) 15%,var(--surface));box-shadow:0 2px 8px rgba(20,24,40,.12),inset 0 3px 0 var(--c)}
.paper.replied{background:var(--paper-replied);filter:grayscale(1);opacity:.92}
.paper.unseen::after{content:"";position:absolute;top:8px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.pa-top{display:flex;align-items:center;gap:5px;min-width:0}
.pa-av{width:16px;height:16px;border-radius:50%;background:var(--c);color:#fff;font-size:7.5px;font-weight:600;display:grid;place-items:center;flex:none}
.paper.replied .pa-av,.paper.fyi .pa-av{background:var(--ink3)}
.pa-from{font-size:10px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.pa-line{height:4px;border-radius:3px;background:color-mix(in srgb,var(--ink) 12%,transparent);width:88%}
.pa-line.short{width:60%}
.folder-wrap:hover .paper{transform:translateY(-10px) rotate(calc(var(--r) * 1.4))}
.folder-wrap:hover .paper:nth-child(2){transition-delay:.03s}.folder-wrap:hover .paper:nth-child(3){transition-delay:.06s}.folder-wrap:hover .paper:nth-child(4){transition-delay:.09s}
.f-front{position:absolute;left:0;right:0;bottom:0;height:63%;border-radius:22px;background:var(--glass);backdrop-filter:blur(16px) saturate(1.5);-webkit-backdrop-filter:blur(16px) saturate(1.5);border:1px solid var(--glass-line);box-shadow:0 12px 28px rgba(20,24,40,.09),0 1px 0 var(--glass-line) inset;display:block;text-align:left}
.f-emoji{position:absolute;left:16px;top:14px;font-size:22px;line-height:1}
.stamp{position:absolute;right:14px;top:-20px;min-width:58px;padding:7px 9px 6px;background:var(--c);color:#fff;border-radius:5px;transform:rotate(7deg);display:flex;flex-direction:column;align-items:center;line-height:1;outline:1.5px dashed rgba(255,255,255,.75);outline-offset:-5px;box-shadow:0 4px 10px rgba(20,24,40,.18)}
.stamp b{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.stamp small{font-size:9.5px;font-weight:500;margin-top:3px;opacity:.95;white-space:nowrap}
.stamp.done{background:var(--surface);color:var(--ok);outline-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.avatars{position:absolute;left:14px;bottom:14px;display:flex}
.av{width:28px;height:28px;border-radius:50%;background:hsl(var(--h) 55% 88%);color:hsl(var(--h) 45% 30%);border:2px solid var(--surface);font-size:10.5px;font-weight:600;display:grid;place-items:center;margin-left:-7px}
.av:first-child{margin-left:0}
.av.more{background:var(--sunk);color:var(--ink2)}
.f-new{position:absolute;right:14px;bottom:18px;font-size:12px;color:var(--ink2);display:inline-flex;align-items:center;gap:6px;font-weight:500}
.f-new i{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.folder.is-open .f-front{height:70%}
/* spread */
.spread{display:grid;grid-template-columns:260px minmax(0,1fr);gap:44px;margin-top:40px;align-items:start}
.spread-side{position:sticky;top:24px}
.spread-side .folder{max-width:260px}
.sp-name{margin-top:18px;font-family:var(--serif);font-weight:400;font-size:30px;letter-spacing:-.02em}
.sp-mail{font-size:13.5px;color:var(--ink3);margin-top:2px;word-break:break-all}
.sp-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.sp-stats b{display:block;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.sp-stats b span{font-size:14px;color:var(--ink3);font-weight:500}
.sp-stats small{font-size:12.5px;color:var(--ink3)}
.meter{height:5px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:12px}
.meter i{display:block;height:100%;background:var(--ink);border-radius:5px;transition:width .4s}
.sp-hint{font-size:13.5px;color:var(--ink3);margin-bottom:12px}
.letters{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.letters li.deal{animation:deal .5s cubic-bezier(.2,.85,.25,1) both;animation-delay:calc(var(--i) * 70ms)}
@keyframes deal{from{opacity:0;transform:translate(-110px,-30px) rotate(-7deg) scale(.9)}}
.letter{width:100%;display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:14px;align-items:start;text-align:left;padding:16px 18px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:0 1px 2px rgba(20,24,40,.05);transition:transform .15s,box-shadow .15s,border-color .15s;position:relative;overflow:hidden}
.letter:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(20,24,40,.08)}
.letter.awaiting{background:color-mix(in srgb,var(--c) 9%,var(--surface));border-color:color-mix(in srgb,var(--c) 30%,var(--line))}
.letter.awaiting::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.letter.replied{background:var(--paper-replied);border-color:transparent;box-shadow:none}
.letter.replied .l-from,.letter.replied .l-subj{color:var(--ink3)}
.letter.replied .l-sum{color:var(--ink3);opacity:.85}
.l-num{font-size:12.5px;color:var(--ink3);font-variant-numeric:tabular-nums;padding-top:2px}
.l-top{display:flex;align-items:center;gap:8px;min-width:0}
.l-new{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.l-from{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l-org{font-size:13px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l-time{margin-left:auto;font-size:12.5px;color:var(--ink3);white-space:nowrap;padding-left:8px}
.l-subj{display:block;margin-top:2px;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l-sum{display:block;margin-top:4px;font-size:13.5px;color:var(--ink2);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.l-status{font-size:12px;font-weight:500;padding:4px 9px;border-radius:999px;white-space:nowrap;margin-top:1px}
.l-status.awaiting{background:color-mix(in srgb,var(--c) 16%,transparent);color:color-mix(in srgb,var(--c) 75%,var(--ink))}
.l-status.replied{background:transparent;color:var(--ink3);border:1px solid var(--line2)}
.l-status.fyi{background:var(--sunk);color:var(--ink3)}
@media (max-width:860px){
  .board-in{padding:20px 16px 110px}

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const wait = ms => new Promise(r => setTimeout(r, ms));
const store = {
  get(k, d){ try{ const v = localStorage.getItem('clearday:'+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('clearday:'+k, JSON.stringify(v)); }catch(e){} },
  clear(){ try{ Object.keys(localStorage).filter(k=>k.startsWith('clearday:')).forEach(k=>localStorage.removeItem(k)); }catch(e){} }
};

/* ---------- dates ---------- */
const NOW = new Date();
const dayStart = d => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
const addDays = n => { const d = new Date(NOW); d.setDate(d.getDate()+n); return d; };
const nextWd = wd => { let n = (wd - NOW.getDay() + 7) % 7; if(n === 0) n = 7; return addDays(n); };
const fmtDay = d => d.toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long'});
const fmtShort = d => d.toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short'});
const fmtDM = d => d.toLocaleDateString('en-GB', {day:'numeric', month:'long'});
function relDay(d){
  const diff = Math.round((dayStart(d) - dayStart(NOW)) / 864e5);
  if(diff === 0) return 'today';
  if(diff === 1) return 'tomorrow';
  if(diff > 1 && diff < 7) return d.toLocaleDateString('en-GB', {weekday:'long'});
  return fmtShort(d);
}

function normalizeEmail(raw){
  const ts = new Date(NOW.getTime() - raw.hoursAgo*3600e3);
  return {
    id:raw.id, accountId:raw.acc, acc:raw.acc,
    sender:raw.fromEmail, senderName:raw.from, from:raw.from, fromEmail:raw.fromEmail, org:raw.org,
    recipients:[accById(raw.acc).email], subject:raw.subject, body:raw.body, timestamp:ts, hoursAgo:raw.hoursAgo,
    _raw:raw
  };
}

const UserProfileService = {
  categoriesFor(p){
    const r = p.roles || [];
    const cats = [];
    if(r.includes('Student') || r.includes('Researcher')) cats.push(['University','🎓']);
    if(r.includes('Founder')) cats.push(['Startup','🚀']);
    if(r.includes('Employee') || r.includes('Manager') || r.includes('Founder') || r.length === 0) cats.push(['Work','💼']);
    if(r.includes('Freelancer')) cats.push(['Clients','🤝']);
    cats.push(['Personal','👤'],['Finance','💰'],['Events','📅'],['Travel','✈️'],['News','📰'],['Notifications','🔔'],['Promotions','🏷️'],['Other','📁']);
    const seen = new Set(); return cats.filter(([c]) => !seen.has(c) && seen.add(c));
  },
  tiers(p){
    const high = [...(p.focus||[]), ...(p.people||[]).map(x => x)];
    const medium = ['Networking & events', ...(p.news||[]).map(n => n+' news')].filter(x => !high.includes(x));
    const low = [...(p.ignore||[]), 'Generic newsletters'];
    return {high: [...new Set(high)], medium:[...new Set(medium)], low:[...new Set(low)]};
  }
};

const EmailClassifier = {
  classify(e, profile){
    const cats = UserProfileService.categoriesFor(profile).map(c => c[0]);
    let cat = e._raw.cat;
    if(!cats.includes(cat)) cat = (cat === 'Startup' || cat === 'University') ? 'Work' : 'Other';
    if(!cats.includes(cat)) cat = 'Other';
    return {category:cat, kind:e._raw.kind};
  }
};

const RANK = ['critical','important','normal','low','noise'];
const PLABEL = {critical:'Critical', important:'Important', normal:'Normal', low:'Low priority', noise:'Noise'};
const PriorityEngine = {
  score(e, profile, corr){
    let p = e._raw.base;
    const reasons = [...e._raw.reasons];
    const dom = e.fromEmail.split('@')[1];
    const hay = (e.from + ' ' + (e.org||'') + ' ' + e.fromEmail).toLowerCase();
    if((profile.ignore||[]).includes('Promotions') && e._raw.kind === 'promo') p = 'noise';
    if(!(profile.ignore||[]).includes('Promotions') && e._raw.kind === 'promo' && p === 'noise') p = 'low';
    const person = (profile.people||[]).find(x => x && x.trim().length > 2 && hay.includes(x.toLowerCase().trim()));
    if(person && RANK.indexOf(p) > 1 && e._raw.kind !== 'promo'){ p = 'important'; reasons.unshift('On your always-important list: '+person); }
    else if(person){ reasons.unshift('On your always-important list: '+person); }
    if(corr.ignore.includes(dom)){ p = 'noise'; reasons.unshift('You asked to ignore similar emails'); }
    if(corr.vip.includes(e.fromEmail)){ if(RANK.indexOf(p) > 1) p = 'important'; reasons.unshift('You always prioritise this sender'); }
    if(corr.override[e.id]){ p = corr.override[e.id]; reasons.unshift('You set this priority yourself'); }
    return {priority:p, reasons};
  }
};

const ActionDetector = {
  detect(e){
    const a = e._raw.action;
    return { requiresAction:!!a, action:a ? {description:a.desc, deadline:a.deadline, how:a.how} : null, event:e._raw.event || null };
  }
};

const SummarizationService = {
  summarize(e){ return { summary:e._raw.summary, catchLine:e._raw.catch || e._raw.summary, lengths:e._raw.sums || null, why:e._raw.why || null, readMin:e._raw.readMin || null }; }
};

const ReplyDraftService = {
  draft(e){ return e._raw.draft || null; },
  preset(e, tone){ if(tone === 'Professional') return e._raw.draft; return e._raw.variants?.[tone] || null; },
  localRewrite(e, text, instr){
    const i = instr.toLowerCase();
    if(/short|brief|concise/.test(i)) return e._raw.variants?.Short || text.split('\n\n').filter((_,k,arr) => k===0 || k===arr.length-1 || k===1).join('\n\n');
    if(/formal/.test(i)) return e._raw.variants?.Formal || text;
    if(/friend|warm/.test(i)) return e._raw.variants?.Friendly || text;
    if(/casual|relax/.test(i)) return e._raw.variants?.Casual || text;
    const t = i.match(/after\s+(\d{1,2}(?::\d{2})?\s*(?:am|pm)?)/);
    if(t){
      const time = t[1].trim();
      if(/\d{1,2}:\d{2}/.test(text)) return text.replace(/(Tuesday|Wednesday|Monday|Thursday|Friday)?\s*at\s+\d{1,2}:\d{2}\s+or\s+(Tuesday|Wednesday|Monday|Thursday|Friday)?\s*at\s+\d{1,2}:\d{2}\s+both work for me/i, `I'm available any day next week after ${time}`).replace(/\d{1,2}:\d{2}/, time);
      const parts = text.split('\n\n'); parts.splice(Math.max(1, parts.length-2), 0, `I'm available after ${time}.`); return parts.join('\n\n');
    }
    if(/confident/.test(i)) return text.replace(/I'd be glad to/g,'I\'ll').replace(/happy to adapt if neither suits you/g,'let me know which works').replace(/Thank you — /,'');
    return null;
  }
};

function runPipeline(){
  const profile = S.profile;
  const out = [];
  for(const raw of MAILBOX){
    const st = S.accounts[raw.acc];
    if(!st || !st.connected) continue;
    const e = normalizeEmail(raw);
    Object.assign(e, EmailClassifier.classify(e, profile));
    Object.assign(e, PriorityEngine.score(e, profile, S.corr));
    Object.assign(e, ActionDetector.detect(e));
    Object.assign(e, SummarizationService.summarize(e));
    e.draftReply = ReplyDraftService.draft(e);
    e.done = S.corr.done.includes(e.id);
    e.seen = S.corr.seen.includes(e.id) || !!e._raw.seen;
    e.replied = S.corr.replied.includes(e.id) || !!e._raw.replied;
    e.needsReply = (e._raw.needsReply ?? e.kind === 'personal') && RANK.indexOf(e.priority) <= 2;
    e.link = e._raw.link || null;
    e.status = e.replied ? 'replied' : e.needsReply ? 'awaiting' : 'fyi';
    out.push(e);
  }
  out.sort((a,b) => RANK.indexOf(a.priority) - RANK.indexOf(b.priority) || a.hoursAgo - b.hoursAgo);
  S.emails = out;
}

  ACCOUNTS = list.map(a => ({id:a.slot, name:a.name, email:a.email, provider:a.provider, providerKey:a.providerKey, error:a.error, lastSync:a.lastSync}));
  S.accounts = {};
  ACCOUNTS.forEach(a => { S.accounts[a.id] = {connected:true, enabled: prev[a.id]?.enabled !== false}; });
}
function liveToRaw(it){
  const d = new Date(it.receivedAt);
  return {...it, hoursAgo: Math.max(0, (NOW - d) / 3600e3),
    reasons: it.reasons?.length ? it.reasons : ['Analysed by Clearday'],
    action: it.action ? {...it.action, deadline: validDate(it.action.deadline)} : null,
    event: it.event && validDate(it.event.date) ? {...it.event, date: validDate(it.event.date), time: it.event.time || 'All day', place: it.event.place || ''} : null};
}
async function liveSync({quiet} = {}){
  LIVE.syncing = true; if(S.view === 'app') render({noFocus:true});
  try{
    const r = await api('/api/sync', {method:'POST', body:{profile:S.profile, categories:UserProfileService.categoriesFor(S.profile).map(c => c[0])}});
    setLiveAccounts(r.accounts);
    MAILBOX = r.items.map(liveToRaw);
    LIVE.lastSync = new Date(); LIVE.errors = r.errors || []; LIVE.ai = r.ai;
    runPipeline();
    if(!quiet && LIVE.errors.length) toast(syncErrorText());
    return r;
  } finally { LIVE.syncing = false; }
}
const syncErrorText = () => LIVE.errors.map(e => `${SLOT_NAMES[e.slot]}: ${e.error === 'reauth' ? 'sign-in expired, reconnect it' : e.error}`).join(' — ');
function blankProfile(){ return {...defaultProfile(), name:'', roles:[], focus:[], responsibilities:'', people:[], news:['AI & technology']}; }
function startLive(){
  S.mode = 'live'; store.set('mode', 'live');
  S.profile = store.get('liveProfile', null) || blankProfile();
  S.chat = []; S.drafts = {}; S.openId = null;
  S.step = 0; S.view = 'onboarding'; render({top:true});
}
async function liveAsk(q){
  try{
    const r = await api('/api/chat', {method:'POST', body:{question:q, history:S.chat.slice(-9, -1), context:InboxAssistant.context()}});
    const refs = (r.refs || []).filter(id => byId(id));
    const draftFor = r.draftFor && byId(r.draftFor) ? r.draftFor : null;
    return {text:r.text || '…', refs, draftFor, draft: draftFor ? r.draft : null, live:true};
  }catch(e){ return {text:`I couldn't reach the AI: ${e.message}`, refs:[]}; }
}
const ymdDash = x => `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
function calLink(e){
  const ev = e.event, d = ev.date, pad = n => String(n).padStart(2,'0');
  const ymd = x => `${x.getFullYear()}${pad(x.getMonth()+1)}${pad(x.getDate())}`;
  const m = (ev.time || '').match(/(\d{1,2}):(\d{2})(?:\s*[–-]\s*(\d{1,2}):(\d{2}))?/);
  let start, end; const allDay = !m;
  if(m){ start = new Date(d); start.setHours(+m[1], +m[2], 0, 0); end = new Date(start); if(m[3]) end.setHours(+m[3], +m[4]); else end.setHours(start.getHours() + 1); }
  if(accById(e.acc)?.provider === 'Outlook'){
    return `https://outlook.office.com/calendar/0/deeplink/compose?${new URLSearchParams({subject:ev.title, location:ev.place || '', body:e.summary || '', startdt: allDay ? ymdDash(d) : start.toISOString(), enddt: allDay ? ymdDash(d) : end.toISOString(), allday:String(allDay), path:'/calendar/action/compose', rru:'addevent'})}`;
  }
  const fmt = x => `${ymd(x)}T${pad(x.getHours())}${pad(x.getMinutes())}00`;
  const nd = new Date(d); nd.setDate(nd.getDate() + 1);
  return `https://calendar.google.com/calendar/render?${new URLSearchParams({action:'TEMPLATE', text:ev.title, dates: allDay ? `${ymd(d)}/${ymd(nd)}` : `${fmt(start)}/${fmt(end)}`, details:e.summary || '', location:ev.place || ''})}`;
}

      ? `${a.error === 'reauth' ? `<button class="btn sm primary" data-act="liveConnect" data-slot="${slot}" data-p="${a.providerKey}">Reconnect</button>` : `<span class="status-ok">✓ Connected</span>`}<button class="btn sm ghost" data-act="disconnect" data-id="${slot}">Disconnect</button>`
      : `${btn('google','Gmail')}${btn('microsoft','Outlook')}${P.mock ? btn('mock','Mock') : ''}`;
    const sub = a ? `${esc(a.email)} — ${a.provider}${a.error === 'reauth' ? ' — sign-in expired' : a.error ? ' — ' + esc(a.error) : ''}` : 'Not connected';
    return `<div class="acc-row"><span class="acc-ico">${a ? a.provider[0] : '+'}${accDot(slot)}</span>

function formatAnswer(t){
  const lines = String(t).split('\n');
  let html = '', inList = false;
  for(const ln of lines){
    const m = ln.match(/^\s*(\d+)[.)]\s+(.*)$/);
    if(m){ if(!inList){ html += '<ol>'; inList = true; } html += `<li>${esc(m[2])}</li>`; }
    else { if(inList){ html += '</ol>'; inList = false; } if(ln.trim()) html += `<p>${esc(ln)}</p>`; }
  }
  if(inList) html += '</ol>';
  return html;
}

const app = document.getElementById('app');
function render(opts = {}){
  const active = document.activeElement;
  const focusId = active && active.id ? active.id : null;
  const selStart = active && 'selectionStart' in active ? active.selectionStart : null;
  const main = document.getElementById('main');
  const scroll = main ? main.scrollTop : 0;
  const sheetScroll = document.querySelector('.sheet-scroll')?.scrollTop || 0;
  const chatInputVal = document.getElementById('chatInput')?.value || '';
  const views = {landing:vLanding, onboarding:vOnboarding, connect:vConnect, analyzing:vAnalyzing, app:vApp};
  app.innerHTML = views[S.view]();
  if(S.view === 'landing' || S.view === 'onboarding' || S.view === 'connect'){ /* scroll handled by container */ }
  const m2 = document.getElementById('main'); if(m2 && !opts.top) m2.scrollTop = scroll;
  const ss = document.querySelector('.sheet-scroll'); if(ss && !opts.sheetTop) ss.scrollTop = sheetScroll;
  const ci = document.getElementById('chatInput'); if(ci && chatInputVal) ci.value = chatInputVal;
  if(focusId && !opts.noFocus){ const el = document.getElementById(focusId); if(el){ el.focus(); try{ if(selStart != null) el.setSelectionRange(selStart, selStart); }catch(e){} } }
  const cs = document.getElementById('chatScroll'); if(cs) cs.scrollTop = cs.scrollHeight;
}

let toastTimer;
function toast(msg){
  document.querySelector('.toast')?.remove();
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role','status'); t.textContent = msg;
  document.body.appendChild(t); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 3200);
}
async function copy(text){
  try{ await navigator.clipboard.writeText(text); toast('Copied to clipboard'); }
  catch(e){ const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); toast('Copied to clipboard'); }catch(_){ toast('Couldn\'t copy — select the text and copy it manually'); } ta.remove(); }
}
function speak(text){
  try{
    if(!('speechSynthesis' in window)){ toast('Read-aloud isn\'t supported in this browser'); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/\n+/g, '. ').replace(/\s+\./g,'.'));
    u.lang = 'en-GB'; u.rate = 1.03; speechSynthesis.speak(u);
  }catch(e){}
}

function startDemo(){
  S.mode = 'demo'; store.set('mode', 'demo');
  ACCOUNTS = DEMO_ACCOUNTS.slice(); MAILBOX = DEMO_MAILBOX;
  S.accounts = store.get('accounts', {}); S.chat = []; S.drafts = {}; S.openId = null;
  S.profile = store.get('profile', null) || defaultProfile();
  S.step = 0; S.view = 'onboarding'; render({top:true});
}
async function connectAcc(id){
  if(S.connecting[id] || S.accounts[id]?.connected) return;
  S.connecting[id] = true; render();
  await providers[accById(id).provider].connect(accById(id));
  S.connecting[id] = false; S.accounts[id] = {connected:true, enabled:true};
  persist();
  if(S.view === 'app'){ runPipeline(); toast(accById(id).name + ' connected'); }
  render();
}
async function analyze(){
  S.view = 'analyzing'; render();
  const live = S.mode === 'live';
  const job = (live ? liveSync({quiet:true}) : (async () => { for(const a of connectedAccs()) await providers[a.provider].fetchMessages(a); })())
    .then(r => ({ok:true, r}), e => ({ok:false, e}));
  let finished = false; job.then(() => { finished = true; });
  const lis = [...document.querySelectorAll('#asteps li')];
  for(let i = 0; i < lis.length; i++){
    lis[i].classList.add('on'); await wait(live ? 800 : 520);
    if(i === lis.length - 1) while(!finished) await wait(200);
    lis[i].classList.add('done'); lis[i].querySelector('.ic').textContent = '✓';
  }
  const res = await job;
  if(!res.ok){ S.view = live ? 'connect' : 'landing'; render({top:true}); toast(res.e.message); return; }
  if(live && LIVE.errors.length) setTimeout(() => toast(syncErrorText()), 400);
  if(!live) runPipeline();
  await wait(300);
  S.view = 'app'; S.page = 'briefing'; persist(); render({top:true});
}

/* ---------- Inbox assistant ---------- */
const InboxAssistant = {
  context(){
    return visible().map(e => ({
      id:e.id, inbox:accById(e.acc).name, from:e.from, org:e.org || undefined, subject:e.subject, priority:e.priority, category:e.category,
      received:e.hoursAgo < 24 ? 'today' : 'yesterday', summary:e.summary,
      action:e.requiresAction ? {task:e.action.description, deadline:e.action.deadline ? fmtDay(e.action.deadline) : null, done:e.done} : undefined,
      event:e.event ? {title:e.event.title, when:fmtDay(e.event.date)+' '+e.event.time, where:e.event.place} : undefined,
      body: RANK.indexOf(e.priority) <= 2 && e.kind !== 'newsletter' ? e.body : undefined
    }));
  },
  async ask(q){
    if(S.mode === 'live') return liveAsk(q);
    if(SAMPLE){
      try{
        const history = S.chat.slice(-7, -1).map(m => (m.role === 'user' ? 'User: ' : 'Clearday: ') + m.text).join('\n');
        const prompt = `You are Clearday, an AI chief of staff for email. Answer the user's question using ONLY the emails below. Be concise, warm and specific — like a sharp personal assistant speaking. Use numbered lines ("1. ...") for lists. Never claim to have sent an email; you only write drafts the user sends themselves.

Today is ${fmtDay(NOW)}.
User profile: ${JSON.stringify({name:S.profile.name, roles:S.profile.roles, priorities:S.profile.focus, alwaysImportant:S.profile.people, responsibilities:S.profile.responsibilities})}
Threads the user started and is still waiting on: Lukas Brandt at Medtech Angels (deck sent 6 days ago, no reply); Student Office about credit transfer (asked 4 days ago, no reply).

Emails (JSON):
${JSON.stringify(this.context())}

${history ? 'Conversation so far:\n' + history + '\n' : ''}
User: ${q}

Respond with JSON only, no markdown fences:
{"answer": string, "refs": [ids of emails you relied on], "draftFor": email id or null, "draft": reply text signed "${firstName()}" or null (only when the user asks for a reply or draft)}`;
        const r = await SAMPLE.json(prompt, {modelTier:'quick', cache:false});
        if(r && typeof r.answer === 'string'){
          const refs = Array.isArray(r.refs) ? r.refs.filter(id => byId(id)) : [];
          const draftFor = r.draftFor && byId(r.draftFor) ? r.draftFor : null;
          return {text:r.answer, refs, draftFor, draft: draftFor && r.draft ? String(r.draft) : null, live:true};
        }
      }catch(err){
        if(err && err.code === 'not_granted') SAMPLE = null;
      }
    }
    await wait(700);
    return this.local(q);
  },
  local(q){
    const ql = q.toLowerCase();
    const has = id => byId(id) && S.accounts[byId(id).acc]?.enabled !== false;
    const pick = ids => ids.filter(has);
    const target = () => /urgent|important|most/.test(ql) ? (visible().find(e => e.status === 'awaiting' && e.draftReply)?.id || 's1') : /admission|university|anna|residence/.test(ql) ? 'u1' : /jonas|manager|report/.test(ql) ? 'w1' : /helena|customer|brightside|bug/.test(ql) ? 's2' : /leo|dinner|friend/.test(ql) ? 'p2' : 's1';
    if(/needs? (a |my )?repl|unanswered|still need|waiting for my|haven.t (replied|answered)/.test(ql)){
      const aw = visible().filter(e => e.status === 'awaiting');
      return {text: aw.length ? `${aw.length} emails are still waiting for your reply:\n${aw.map((e,i) => `${i+1}. ${e.from} — ${e.subject}`).join('\n')}\nI've prepared drafts for most of them. Open one to review it.` : 'You\'ve replied to everything important.', refs: aw.map(e => e.id)};
    }
    if(/draft|reply|respond|write back|answer (her|him|them)/.test(ql)){
      const id = target(); const e = byId(id);
      if(!e) return {text:'That inbox isn\'t connected right now, so I can\'t draft that reply.', refs:[]};
      return {text:`Sure. I've prepared a draft reply to ${e.from}. I haven't sent anything — review it, then send it from ${accById(e.acc).provider} when you're happy.`, refs:[id], draftFor:id, draft:e.draftReply || ReplyDraftService.draft(e) || `Hi ${e.from.split(' ')[0]},\n\nThanks for your message — I'll get back to you shortly.\n\nBest,\n${firstName()}`};
    }
    if(/investor|northwind|maria|vc\b/.test(ql)){
      if(!has('s1')) return {text:'I don\'t see any investor replies in your connected inboxes.', refs:[]};
      return {text:'Yes — Maria Okafor, a partner at Northwind Ventures, replied to Erik\'s intro. She liked your deck and the pilot traction, and asked for a 30-minute call next week, ideally Tuesday or Wednesday afternoon. She wants to understand your go-to-market and pilot-to-paid conversion.\nA draft reply is ready whenever you want it.', refs:['s1']};
    }
    if(/startup|clinicflow|company/.test(ql)){
      const r = pick(['s1','s2','s3','e1','n2']);
      return {text:`Four things happened with Clinicflow:\n1. An investor replied: Maria at Northwind Ventures wants a 30-minute call next week.\n2. Brightside Clinics says the pilot saves them about 40 minutes a day, and reported two bugs to fix before November.\n3. Sam shipped the new onboarding to staging — activation went from 31% to 44%.\n4. You're on the list for the agentic AI founders meetup on ${relDay(D.thursday)} at 18:00.\nThe one that needs you is Maria's email.`, refs:r};
    }
    if(/universit|professor|exam|school|course|admission/.test(ql)){
      const r = pick(['u1','u2','u4']);
      return {text:`Yes, three people from university:\n1. Admissions needs a copy of your residence permit by tomorrow, or your application goes on hold.\n2. Prof. Lindqvist moved your Strategy & Innovation exam earlier, to ${fmtDay(D.examNew)}.\n3. Mika uploaded the group project slides and will merge everything on Sunday evening.\nThe admissions document is the urgent one.`, refs:r};
    }
    if(/deadline|due/.test(ql)){
      const dl = actions().filter(e => e.action.deadline && !e.done);
      if(!dl.length) return {text:'No open deadlines right now.', refs:[]};
      return {text:`You have ${dl.length} deadline${dl.length>1?'s':''}:\n${dl.map((e,i) => `${i+1}. ${e.action.description} — ${relDay(e.action.deadline)} (${fmtShort(e.action.deadline)})`).join('\n')}\nAlso worth knowing: your exam moved to ${fmtShort(D.examNew)}.`, refs:dl.map(e => e.id).concat(has('u2')?['u2']:[])};
    }
    if(/waiting|hear back|response from|replied to me/.test(ql)){
      return {text:'Two threads you started are still open:\n1. Lukas Brandt at Medtech Angels — you sent the deck 6 days ago, no reply yet.\n2. The Student Office about your credit transfer — asked 4 days ago.\nMaria at Northwind did reply, so that one\'s off the list.', refs:pick(['s1'])};
    }
    if(/meeting|invit|event|calendar/.test(ql)){
      const ev = events();
      return {text:`I found ${ev.length} events and invitations:\n${ev.map((e,i) => `${i+1}. ${e.event.title} — ${fmtShort(e.event.date)}, ${e.event.time}`).join('\n')}\nPlus Maria\'s request for a call next week, which still needs a time.`, refs:ev.map(e => e.id).concat(has('s1')?['s1']:[])};
    }
    if(/bank|security|money|finance|payment/.test(ql)){
      return {text:'Nordbank flagged a new sign-in from Chrome on Windows in Malmö at 07:42 today. If that wasn\'t you, block your card in the app. Everything else money-related is routine: a payout of 18,400 SEK is scheduled and your payslip is available.', refs:pick(['p1'])};
    }
    if(/yesterday|summar|happen|catch|inbox today|overview/.test(ql)){
      const m = matter();
      return {text:`You received ${visible().length} emails. ${m.length} are important:\n${m.map((e,i) => `${i+1}. ${e.catchLine}`).join('\n')}\nThe other ${visible().length - m.length} were routine or summarised.`, refs:m.map(e => e.id)};
    }
    if(/today|need to|to do|todo|to-do|should i/.test(ql)){
      const a = openActions();
      return {text:a.length ? `You have ${a.length} things to do:\n${a.map((e,i) => `${i+1}. ${e.action.description}${e.action.deadline ? ' — due ' + relDay(e.action.deadline) : ''}`).join('\n')}\nStart with the admissions document — it's due tomorrow. Drafts are ready for all three.` : 'Nothing needs you right now. Nice.', refs:a.map(e => e.id)};
    }
    const m = matter().slice(0,3);
    return {text:`I couldn't find anything specific about that in your ${visible().length} emails. Here's what matters most right now:\n${m.map((e,i) => `${i+1}. ${e.catchLine}`).join('\n')}`, refs:m.map(e => e.id)};
  }
};

async function ask(q){
  q = q.trim(); if(!q || S.chatBusy) return;
  if(S.page !== 'assistant'){ S.page = 'assistant'; }
  S.chat.push({role:'user', text:q}); S.chatBusy = true;
  const ci = document.getElementById('chatInput'); if(ci) ci.value = '';
  render({noFocus:true});
  const r = await InboxAssistant.ask(q);
  S.chatBusy = false;
  S.chat.push({role:'ai', text:r.text, refs:r.refs || [], draft:r.draft || null, draftFor:r.draftFor || null, live:!!r.live});
  if(r.draft && r.draftFor) S.drafts[r.draftFor] = {text:r.draft, tone:'Professional'};
  render({noFocus:true});
  if(S.voiceMode) speak(r.text + (r.draft ? ' The draft is on screen for you to review.' : ''));
}

/* ---------- voice ---------- */
let recog = null;
function toggleMic(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  S.voiceMode = true;
  if(!SR){ render(); toast('Speech recognition isn\'t available in this browser — try Chrome, or tap a phrase'); return; }
  if(S.listening){ try{ recog && recog.stop(); }catch(e){} S.listening = false; render(); return; }
  try{
    recog = new SR(); recog.lang = 'en-GB'; recog.interimResults = true; recog.maxAlternatives = 1;
    let finalText = '';
    recog.onresult = ev => {
      let interim = '';
      for(let i = ev.resultIndex; i < ev.results.length; i++){
        const t = ev.results[i][0].transcript;
        if(ev.results[i].isFinal) finalText += t; else interim += t;
      }
      const ci = document.getElementById('chatInput'); if(ci) ci.value = finalText + interim;
    };
    recog.onerror = ev => { S.listening = false; render(); toast(ev.error === 'not-allowed' || ev.error === 'service-not-allowed' ? 'Microphone access is blocked here — tap a phrase or type instead' : 'Didn\'t catch that — try again'); };
    recog.onend = () => { S.listening = false; const t = finalText.trim(); render(); if(t) ask(t); };
    recog.start(); S.listening = true; render();
  }catch(e){ S.listening = false; render(); toast('Couldn\'t start the microphone — tap a phrase or type instead'); }
}

/* ---------- draft rewriting ---------- */
async function rewrite(id, instr, tone){
  const e = byId(id); if(!e) return;
  const cur = S.drafts[id] || {text:e.draftReply || '', tone:'Professional'};
  const preset = tone ? ReplyDraftService.preset(e, tone) : null;
  if(tone && preset){ S.drafts[id] = {text:preset, tone}; render({noFocus:true}); return; }
  const instruction = instr || `Rewrite in a ${tone.toLowerCase()} tone.`;
  if(S.mode === 'live'){
    S.drafts[id] = {...cur, busy:true, tone: tone || cur.tone}; render({noFocus:true});
    try{
      const r = await api('/api/rewrite', {method:'POST', body:{email:{fromName:e.from, fromEmail:e.fromEmail, subject:e.subject, body:e.body}, draft:cur.text, instruction}});
      S.drafts[id] = {text:r.text, tone: tone || cur.tone};
    }catch(err){ S.drafts[id] = {...cur, busy:false}; toast(err.message); }
    render({noFocus:true}); return;
  }
  if(SAMPLE){
    S.drafts[id] = {...cur, busy:true, tone: tone || cur.tone}; render({noFocus:true});
    try{
      const r = await SAMPLE(`Rewrite this email reply. Instruction: ${instruction}
Keep it a reply to the email below, keep facts consistent, sign it "${firstName()}". Return ONLY the new reply text, no preamble.

Email being replied to (from ${e.from}, ${e.org || ''}):
${e.body}

Current draft:
${cur.text}`, {modelTier:'quick', cache:false});
      S.drafts[id] = {text:r.text.trim(), tone: tone || cur.tone};
      render({noFocus:true}); return;
    }catch(err){ if(err && err.code === 'not_granted') SAMPLE = null; S.drafts[id] = {...cur, busy:false}; }
  }
  const local = ReplyDraftService.localRewrite(e, cur.text, instruction);
  if(local){ S.drafts[id] = {text:local, tone: tone || (/short/i.test(instruction) ? 'Short' : cur.tone)}; render({noFocus:true}); }
  else { S.drafts[id] = {...cur, busy:false}; render({noFocus:true}); toast('Live rewriting needs Claude access. Try a tone button, or "make it shorter".'); }
}

  toggleAcc(el){ const st = S.accounts[el.dataset.id]; st.enabled = st.enabled === false; persist(); render({noFocus:true}); toast(`${accById(el.dataset.id).name} ${st.enabled ? 'shown in' : 'hidden from'} your briefing`); },

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if(!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if(fn){ ev.preventDefault(); fn(el); }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if(t.dataset.bind){ S.profile[t.dataset.bind] = t.value; }
  if(t.id === 'f-search'){ S.query = t.value; render(); }
  if(t.id === 'draftText'){ const id = t.dataset.id; S.drafts[id] = {...(S.drafts[id] || {tone:'Professional'}), text:t.value}; }
  if(t.id === 'f-people'){ S.peopleInput = t.value; }
  if(t.id === 'chatInput'){ t.style.height = 'auto'; t.style.height = Math.min(140, t.scrollHeight) + 'px'; }
});
document.addEventListener('keydown', ev => {
  const t = ev.target;
  if(t.id === 'chatInput' && ev.key === 'Enter' && !ev.shiftKey){ ev.preventDefault(); ask(t.value); }
  if(t.id === 'f-people' && ev.key === 'Enter'){ ev.preventDefault(); const v = t.value.trim(); if(v && !S.profile.people.includes(v)) S.profile.people.push(v); S.peopleInput = ''; render(); document.getElementById('f-people')?.focus(); }
  if(t.id === 'boardQ' && ev.key === 'Enter'){ ev.preventDefault(); const v = t.value.trim(); if(v) ask(v); }
  if(t.id === 'draftAsk' && ev.key === 'Enter'){ ev.preventDefault(); const v = t.value.trim(); if(v) rewrite(t.dataset.id, v, null); }
  if(ev.key === 'Escape'){ if(S.catchup){ ACT.closeCatch(); } else if(S.openId){ ACT.close(); } else if(S.navOpen){ ACT.navClose(); } }
});

/* boot */
(async function boot(){
  if(S.mode === 'live'){ if(S.view === 'app') S.view = 'landing'; S.profile = store.get('liveProfile', null) || S.profile; }
  else if(S.view === 'app'){ if(connectedAccs().length) runPipeline(); else S.view = 'landing'; }
  render();
  try{ const h = await api('/api/health'); if(h && h.app === 'clearday'){ LIVE.available = true; LIVE.ai = h.ai; LIVE.providers = h.providers || {}; } }catch(e){}
  if(!LIVE.available){ if(S.mode === 'live'){ S.mode = 'demo'; S.profile = store.get('profile', null) || defaultProfile(); render(); } return; }
  const qs = new URLSearchParams(location.search);
  let me = null; try{ me = await api('/api/me'); }catch(e){}
  if(qs.has('connected') || qs.has('auth_error')){
    history.replaceState(null, '', location.pathname);
    S.mode = 'live'; store.set('mode', 'live');
    S.profile = store.get('liveProfile', null) || me?.profile || blankProfile();
    setLiveAccounts(me?.accounts || []);
    S.view = 'connect'; render({top:true});
    toast(qs.get('auth_error') ? `Couldn't connect: ${qs.get('auth_error')}` : `${SLOT_NAMES[qs.get('connected')] || 'Inbox'} connected`);
    return;
  }
  if(S.mode === 'live' && me?.accounts?.length){
    S.profile = me.profile || S.profile;
    setLiveAccounts(me.accounts);
    analyze();
    return;
  }
  render();
})();
